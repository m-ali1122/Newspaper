<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 990" width="1620" height="990" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.10"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
    <style>
      .panel{fill:#0f172a;fill-opacity:.72;stroke-width:1.4}
      .card{fill:#16213d;stroke:#ffffff;stroke-opacity:.08}
      .lane{font-size:12px;font-weight:700;letter-spacing:2.2px}
      .t{font-size:15.5px;font-weight:700;fill:#f1f5f9}
      .b{font-size:12.5px;fill:#94a3b8}
      .m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px;fill:#a7f3d0}
      .flow{stroke:#cbd5e1;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .loop{stroke:#fb7185;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arR)}
      .lbl{font-size:11.5px;fill:#cbd5e1;font-style:italic}
      .pill{fill:#1e293b;stroke:#334155}
      .pt{font-size:12.5px;fill:#e2e8f0;font-weight:600}
    </style>
  </defs>

  <rect width="1620" height="990" fill="url(#bg)"/>
  <rect width="1620" height="990" fill="url(#grid)"/>
  <rect width="1620" height="500" fill="url(#glow)"/>

  <!-- Title -->
  <text x="60" y="78" font-size="34" font-weight="800" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif">The Morning Paper</text>
  <text x="372" y="78" font-size="34" font-weight="300" fill="#64748b">— System Architecture</text>
  <text x="60" y="110" font-size="15" fill="#94a3b8">A personal newspaper that learns from every read, skip, like and spoken request. Classical AI end to end — no paid LLM calls.</text>
  <g transform="translate(1340,58)">
    <rect width="220" height="34" rx="17" fill="#052e2b" stroke="#34d399" stroke-opacity=".6"/>
    <circle cx="20" cy="17" r="5" fill="#34d399"/>
    <text x="34" y="22" font-size="13" font-weight="700" fill="#a7f3d0">Live on Vercel · FastAPI</text>
  </g>

  <!-- ===== Lane 1: Sources ===== -->
  <rect class="panel" x="60" y="160" width="240" height="490" rx="16" stroke="#f59e0b" stroke-opacity=".55" filter="url(#sh)"/>
  <text class="lane" x="80" y="192" fill="#fbbf24">① SOURCES</text>
  <rect class="card" x="76" y="214" width="208" height="118" rx="11"/>
  <rect x="76" y="214" width="4" height="118" rx="2" fill="#f59e0b"/>
  <text class="t" x="94" y="242">Live RSS feeds</text>
  <text class="b" x="94" y="266">World, Pakistan, business,</text>
  <text class="b" x="94" y="284">tech, science, sport …</text>
  <text class="b" x="94" y="308">feedparser · httpx</text>
  <rect class="card" x="76" y="350" width="208" height="118" rx="11"/>
  <rect x="76" y="350" width="4" height="118" rx="2" fill="#f59e0b"/>
  <text class="t" x="94" y="378">News archive</text>
  <text class="b" x="94" y="402">Express Tribune corpus</text>
  <text class="b" x="94" y="420">historical articles,</text>
  <text class="b" x="94" y="438">offline fallback</text>
  <rect class="card" x="76" y="486" width="208" height="146" rx="11"/>
  <rect x="76" y="486" width="4" height="146" rx="2" fill="#f59e0b"/>
  <text class="t" x="94" y="514">Reader onboarding</text>
  <text class="b" x="94" y="538">Name &amp; city → section</text>
  <text class="b" x="94" y="556">cards → "in your own words"</text>
  <text class="b" x="94" y="574">(typed or spoken) →</text>
  <text class="b" x="94" y="592">reading time &amp; tone</text>

  <!-- ===== Lane 2: Ingest & NLP ===== -->
  <rect class="panel" x="360" y="160" width="280" height="490" rx="16" stroke="#38bdf8" stroke-opacity=".55" filter="url(#sh)"/>
  <text class="lane" x="380" y="192" fill="#7dd3fc">② INGEST &amp; NLP</text>
  <g>
    <rect class="card" x="376" y="214" width="248" height="70" rx="11"/>
    <text class="t" x="394" y="242">Named entities</text>
    <text class="b" x="394" y="264">spaCy NER + normalisation</text>
    <rect class="card" x="376" y="298" width="248" height="70" rx="11"/>
    <text class="t" x="394" y="326">Sentiment &amp; tone</text>
    <text class="b" x="394" y="348">VADER + TextBlob blend</text>
    <rect class="card" x="376" y="382" width="248" height="70" rx="11"/>
    <text class="t" x="394" y="410">Keywords &amp; topics</text>
    <text class="b" x="394" y="432">TF-IDF · NMF topic model</text>
    <rect class="card" x="376" y="466" width="248" height="70" rx="11"/>
    <text class="t" x="394" y="494">Section classifier</text>
    <text class="b" x="394" y="516">10 sections, keyword priors</text>
    <rect class="card" x="376" y="550" width="248" height="82" rx="11"/>
    <text class="t" x="394" y="578">Intent grammar</text>
    <text class="b" x="394" y="600">"more climate, less cricket"</text>
    <text class="b" x="394" y="618">→ structured preferences</text>
  </g>

  <!-- ===== Lane 3: Storage & Knowledge ===== -->
  <rect class="panel" x="700" y="160" width="270" height="490" rx="16" stroke="#a78bfa" stroke-opacity=".55" filter="url(#sh)"/>
  <text class="lane" x="720" y="192" fill="#c4b5fd">③ MEMORY &amp; KNOWLEDGE</text>
  <rect class="card" x="716" y="214" width="238" height="196" rx="11"/>
  <rect x="716" y="214" width="4" height="196" rx="2" fill="#a78bfa"/>
  <text class="t" x="734" y="242">SQLite store</text>
  <g font-size="12.5" fill="#cbd5e1">
    <rect x="734" y="258" width="96" height="26" rx="6" fill="#241b45"/><text x="746" y="276">articles</text>
    <rect x="838" y="258" width="98" height="26" rx="6" fill="#241b45"/><text x="850" y="276">entities</text>
    <rect x="734" y="292" width="96" height="26" rx="6" fill="#241b45"/><text x="746" y="310">profiles</text>
    <rect x="838" y="292" width="98" height="26" rx="6" fill="#241b45"/><text x="850" y="310">events</text>
    <rect x="734" y="326" width="96" height="26" rx="6" fill="#241b45"/><text x="746" y="344">editions</text>
    <rect x="838" y="326" width="98" height="26" rx="6" fill="#241b45"/><text x="850" y="344">history</text>
  </g>
  <text class="b" x="734" y="380">One shared store; every</text>
  <text class="b" x="734" y="398">signal is an event row</text>
  <rect class="card" x="716" y="440" width="238" height="192" rx="11"/>
  <rect x="716" y="440" width="4" height="192" rx="2" fill="#a78bfa"/>
  <text class="t" x="734" y="468">Knowledge graph</text>
  <text class="b" x="734" y="490">networkx entity co-occurrence</text>
  <!-- mini graph -->
  <g stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.3">
    <line x1="770" y1="540" x2="830" y2="515"/><line x1="830" y1="515" x2="900" y2="535"/>
    <line x1="770" y1="540" x2="820" y2="570"/><line x1="820" y1="570" x2="900" y2="535"/>
    <line x1="830" y1="515" x2="820" y2="570"/><line x1="900" y1="535" x2="925" y2="580"/>
  </g>
  <g fill="#c4b5fd"><circle cx="770" cy="540" r="6"/><circle cx="830" cy="515" r="9"/><circle cx="900" cy="535" r="7"/><circle cx="820" cy="570" r="5"/><circle cx="925" cy="580" r="4"/></g>
  <text class="b" x="734" y="608">PageRank salience · story</text>
  <text class="b" x="734" y="624">threads · interest expansion</text>

  <!-- ===== Lane 4: The Editor ===== -->
  <rect class="panel" x="1030" y="160" width="270" height="490" rx="16" stroke="#34d399" stroke-opacity=".55" filter="url(#sh)"/>
  <text class="lane" x="1050" y="192" fill="#6ee7b7">④ THE EDITOR</text>
  <rect class="card" x="1046" y="214" width="238" height="236" rx="11"/>
  <rect x="1046" y="214" width="4" height="236" rx="2" fill="#34d399"/>
  <text class="t" x="1064" y="242">Ranking engine</text>
  <rect x="1060" y="256" width="212" height="104" rx="8" fill="#062a22"/>
  <text class="m" x="1070" y="278">score = α·cos(tfidf, you)</text>
  <text class="m" x="1070" y="298">      + β·section_weight</text>
  <text class="m" x="1070" y="318">      + γ·Thompson(Beta)</text>
  <text class="m" x="1070" y="338">      + δ·recency + prior</text>
  <text class="b" x="1064" y="388">avoid-filter → de-duplicate</text>
  <text class="b" x="1064" y="406">→ MMR diversity re-rank</text>
  <text class="b" x="1064" y="430">every pick has a "why this?"</text>
  <rect class="card" x="1046" y="480" width="238" height="152" rx="11"/>
  <rect x="1046" y="480" width="4" height="152" rx="2" fill="#34d399"/>
  <text class="t" x="1064" y="508">Edition builder</text>
  <text class="b" x="1064" y="532">Lead story, sections, In Brief</text>
  <text class="b" x="1064" y="550">fitted to reading-time budget</text>
  <text class="b" x="1064" y="574">"Off Your Beaten Path"</text>
  <text class="b" x="1064" y="592">ε-greedy serendipity picks</text>
  <text class="b" x="1064" y="616">Mood meter · daily archive</text>

  <!-- ===== Lane 5: Delivery ===== -->
  <rect class="panel" x="1360" y="160" width="200" height="490" rx="16" stroke="#f472b6" stroke-opacity=".55" filter="url(#sh)"/>
  <text class="lane" x="1380" y="192" fill="#f9a8d4">⑤ DELIVERY</text>
  <rect class="card" x="1376" y="214" width="168" height="94" rx="11"/>
  <text class="t" x="1392" y="242">Web reader</text>
  <text class="b" x="1392" y="264">Newspaper layout,</text>
  <text class="b" x="1392" y="282">tracked click-through</text>
  <rect class="card" x="1376" y="320" width="168" height="94" rx="11"/>
  <text class="t" x="1392" y="348">Broadsheet PDF</text>
  <text class="b" x="1392" y="370">reportlab, 3 columns,</text>
  <text class="b" x="1392" y="388">clickable links</text>
  <rect class="card" x="1376" y="426" width="168" height="94" rx="11"/>
  <text class="t" x="1392" y="454">Voice editor</text>
  <text class="b" x="1392" y="476">Web Speech STT →</text>
  <text class="b" x="1392" y="494">intent → TTS reply</text>
  <rect class="card" x="1376" y="532" width="168" height="100" rx="11"/>
  <text class="t" x="1392" y="560">Insights</text>
  <text class="b" x="1392" y="582">Profile drift over</text>
  <text class="b" x="1392" y="600">time · knowledge map</text>

  <!-- ===== Main flow arrows ===== -->
  <path class="flow" d="M284 273 H372"/>
  <path class="flow" d="M284 409 H372"/>
  <text class="lbl" x="300" y="262">raw</text>
  <path class="flow" d="M624 300 H712"/>
  <text class="lbl" x="638" y="290">enriched</text>
  <path class="flow" d="M835 410 V436"/>
  <path class="flow" d="M954 300 H1042"/>
  <text class="lbl" x="962" y="290">candidates</text>
  <path class="flow" d="M954 536 H1042"/>
  <text class="lbl" x="964" y="526">graph priors</text>
  <path class="flow" d="M1165 450 V476"/>
  <path class="flow" d="M1284 556 H1310 V261 H1372"/>
  <path class="flow" d="M1310 367 H1372"/>
  <path class="flow" d="M1310 473 H1372"/>
  <path class="flow" d="M1310 582 H1372"/>
  <!-- onboarding -> intent grammar -->
  <path class="flow" d="M284 591 H372"/>

  <!-- ===== Learning loop ===== -->
  <rect class="panel" x="360" y="712" width="1200" height="150" rx="16" stroke="#fb7185" stroke-opacity=".6" filter="url(#sh)"/>
  <text class="lane" x="380" y="744" fill="#fda4af">⑥ LEARNING LOOP  ·  the paper gets better every day</text>
  <g>
    <rect class="card" x="380" y="762" width="262" height="80" rx="11"/>
    <text class="t" x="398" y="790">Reader signals</text>
    <text class="b" x="398" y="812">click · dwell · like · skip</text>
    <text class="b" x="398" y="830">voice "more / less / avoid"</text>
    <rect class="card" x="676" y="762" width="262" height="80" rx="11"/>
    <text class="t" x="694" y="790">Rocchio update</text>
    <text class="b" x="694" y="812">keyword · entity · section</text>
    <text class="b" x="694" y="830">weights nudged per signal</text>
    <rect class="card" x="972" y="762" width="262" height="80" rx="11"/>
    <text class="t" x="990" y="790">Beta bandit per section</text>
    <text class="b" x="990" y="812">Thompson sampling balances</text>
    <text class="b" x="990" y="830">exploit vs. explore</text>
    <rect class="card" x="1268" y="762" width="272" height="80" rx="11"/>
    <text class="t" x="1286" y="790">Updated profile</text>
    <text class="b" x="1286" y="812">written back to SQLite →</text>
    <text class="b" x="1286" y="830">tomorrow's edition</text>
  </g>
  <path class="flow" d="M642 802 H672"/>
  <path class="flow" d="M938 802 H968"/>
  <path class="flow" d="M1234 802 H1264"/>
  <!-- delivery -> signals -->
  <path class="loop" d="M1460 650 V690 H511 V758"/>
  <text class="lbl" x="1100" y="682" fill="#fda4af">every interaction is a training signal</text>
  <!-- profile -> sqlite profiles -->
  <path class="loop" d="M1404 762 V700 H995 V380 H958"/>
  <text class="lbl" x="1000" y="372" fill="#fda4af">profile</text>
  <!-- onboarding seeds profile -->
  <path class="loop" d="M180 632 V802 H376"/>
  <text class="lbl" x="196" y="790" fill="#fda4af">seeds profile</text>

  <!-- ===== Footer stack ===== -->
  <text class="lane" x="60" y="912" fill="#64748b">STACK</text>
  <g>
    <rect class="pill" x="130" y="894" width="96" height="28" rx="14"/><text class="pt" x="146" y="913">Python 3.12</text>
    <rect class="pill" x="236" y="894" width="132" height="28" rx="14"/><text class="pt" x="252" y="913">FastAPI · uvicorn</text>
    <rect class="pill" x="378" y="894" width="72" height="28" rx="14"/><text class="pt" x="394" y="913">SQLite</text>
    <rect class="pill" x="460" y="894" width="104" height="28" rx="14"/><text class="pt" x="476" y="913">scikit-learn</text>
    <rect class="pill" x="574" y="894" width="84" height="28" rx="14"/><text class="pt" x="590" y="913">networkx</text>
    <rect class="pill" x="668" y="894" width="66" height="28" rx="14"/><text class="pt" x="684" y="913">spaCy</text>
    <rect class="pill" x="744" y="894" width="132" height="28" rx="14"/><text class="pt" x="760" y="913">VADER · TextBlob</text>
    <rect class="pill" x="886" y="894" width="86" height="28" rx="14"/><text class="pt" x="902" y="913">reportlab</text>
    <rect class="pill" x="982" y="894" width="214" height="28" rx="14"/><text class="pt" x="998" y="913">Vanilla JS · Web Speech API</text>
    <rect class="pill" x="1206" y="894" width="190" height="28" rx="14" fill="#052e2b" stroke="#34d399"/><text class="pt" x="1222" y="913" fill="#a7f3d0">Vercel serverless</text>
  </g>
  <text x="60" y="958" font-size="12" fill="#475569">Flow: sources → NLP enrichment → shared memory + knowledge graph → ranked, diversified edition → web / PDF / voice → reader signals → learned profile.</text>
</svg>
