<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Morning Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav id="nav" class="topnav" hidden>
  <a href="#/paper/today" data-r="paper">Today's Paper</a>
  <a href="#/archive" data-r="archive">Archive</a>
  <a href="#/insights" data-r="insights">How it learned</a>
  <a href="#/welcome" data-r="welcome">New reader</a>
</nav>
<main id="app"></main>

<button id="voice-fab" class="fab" hidden aria-label="Ask your editor"><span class="fab-ic">&#127908;</span><span class="fab-tx">Ask your editor</span></button>
<section id="voice-panel" class="vpanel" hidden>
  <header><b>Ask your editor</b><button id="vp-close" aria-label="Close">&times;</button></header>
  <div id="vp-log" class="vp-log"><p class="vp-hint">Try: &ldquo;more about AI startups&rdquo;, &ldquo;less celebrity gossip&rdquo;, &ldquo;read me the headlines&rdquo;.</p></div>
  <div class="vp-actions" id="vp-actions"></div>
  <form id="vp-form">
    <button type="button" id="vp-mic" class="mic" aria-label="Speak">&#127908;</button>
    <input id="vp-input" type="text" placeholder="Type a command&hellip;" autocomplete="off">
    <button type="submit" class="btn small">Send</button>
  </form>
</section>
<div id="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
